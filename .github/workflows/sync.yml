name: Sync Montreal Cinema Showtimes

on:
  schedule:
    # 09:00 UTC every day.
    # This corresponds to 4:00 AM EST during standard time.
    - cron: "0 9 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-showtimes:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape showtimes and generate calendar
        run: |
          python scraper.py

      - name: Commit updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add montreal_cinema.ics

          if git diff --cached --quiet; then
            echo "No calendar changes to commit."
            exit 0
          fi

          git commit -m "Update Montreal cinema showtimes"

          git push
